name: Validate PowerShell bootstrap

on:
  pull_request:
    paths:
      - "power-platform/**/*.ps1"
      - ".github/workflows/powershell-static.yml"
  push:
    branches:
      - main
    paths:
      - "power-platform/**/*.ps1"
      - ".github/workflows/powershell-static.yml"

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          $files = Get-ChildItem -Path "power-platform" -Recurse -Filter "*.ps1"

          foreach ($file in $files) {
            $tokens = $null
            $errors = $null

            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "::error file=$($file.FullName)::PowerShell parse errors found."
              foreach ($errorItem in $errors) {
                Write-Host "::error file=$($file.FullName),line=$($errorItem.Extent.StartLineNumber)::$($errorItem.Message)"
              }
            }
            else {
              Write-Host "OK: $($file.FullName)"
            }
          }

          if ($failed) {
            exit 1
          }
